[package]
name = "gfe_bm_rust"
version = "0.1.0"
edition = "2021"
authors = ["Eliot R. Weinstein <eliotw@uchicago.edu>"]
description = "Grouped fixed-effects (Bonhomme and Manresa 2015) estimation in Rust: Algorithm 1, local search and variable neighborhood search"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rand_xoshiro = "0.6"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
